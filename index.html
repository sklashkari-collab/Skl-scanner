<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKL SCANNER V4 FINAL</title>
    <style>
        body { margin: 0; background: #000; color: #bf953f; font-family: sans-serif; text-align: center; }
        .header { padding: 15px; border-bottom: 2px solid #bf953f; font-size: 20px; font-weight: bold; }
        #chart-container { width: 100%; height: 550px; margin-top: 10px; background: #111; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; padding: 10px; }
        button { background: #1e293b; color: white; border: 1px solid #bf953f; padding: 10px 5px; border-radius: 4px; font-size: 12px; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

<div class="header">SKL SCANNER V4 🚀</div>

<div id="chart-container">
    <iframe id="tv-chart" src="https://www.tradingview.com/chart/?symbol=NSE:NIFTY&interval=5&theme=dark"></iframe>
</div>

<div class="btn-grid">
    <button onclick="update('NIFTY')">NIFTY</button>
    <button onclick="update('BANKNIFTY')">BANK NIFTY</button>
    <button onclick="update('RELIANCE')">RELIANCE</button>
    <button onclick="update('SBIN')">SBIN</button>
    <button onclick="update('AARTIIND')">AARTI IND</button>
    <button onclick="update('TATAMOTORS')">TATA MOTORS</button>
</div>

<script>
    function update(s) {
        // Direct TradingView Chart load karne ka logic
        document.getElementById('tv-chart').src = "https://www.tradingview.com/chart/?symbol=NSE:" + s + "&interval=5&theme=dark";
    }
</script>

</body>
</html>
