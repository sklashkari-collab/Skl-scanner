<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKL SCANNER PRO 🚀</title>
    <script src="https://s3.tradingview.com/tv.js"></script>
    <style>
        :root { --bg: #000; --card: #111; --gold: linear-gradient(45deg, #ffd700, #ff8c00); }
        body { margin: 0; background: var(--bg); color: #fff; font-family: sans-serif; }
        .header { background: #000; padding: 15px; text-align: center; border-bottom: 2px solid #333; }
        .nav-tabs { display: flex; overflow-x: auto; background: #000; padding: 10px; gap: 10px; }
        .tab { background: #1e293b; padding: 10px 20px; border-radius: 5px; cursor: pointer; white-space: nowrap; }
        .tab.active { background: var(--gold); color: #000; font-weight: bold; }
        .container { padding: 12px; }
        #tv_chart_main { height: 500px; width: 100%; border: 1px solid #333; border-radius: 8px; margin-top: 10px; }
        .stock-list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .stock-btn { background: #1e293b; padding: 15px; border-radius: 8px; text-align: center; cursor: pointer; border: 1px solid #333; }
    </style>
</head>
<body>

<div class="header">
    <h2 style="margin:0; background: var(--gold); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">SKL SCANNER PRO 🚀</h2>
</div>

<div class="nav-tabs">
    <div class="tab active" onclick="showTab('dashboard')">DASHBOARD</div>
    <div class="tab" onclick="showTab('options')">OPTION CHAIN</div>
    <div class="tab" onclick="showTab('stocks')">206 FnO STOCKS</div>
</div>

<div class="container">
    <div style="border: 1px dashed red; padding: 10px; border-radius: 8px; text-align: center; margin-bottom: 10px;">
        <h4 id="current_symbol" style="margin:5px;">NSE:NIFTY</h4>
        <span style="color: #22c55e; font-size: 12px; font-weight: bold;">BULLISH CONFIRMED ✅</span>
    </div>
    
    <div id="tv_chart_main"></div>

    <div id="stocks_section" class="stock-list">
        <div class="stock-btn" onclick="loadChart('AARTIIND')">AARTIIND</div>
        <div class="stock-btn" onclick="loadChart('ABB')">ABB</div>
        <div class="stock-btn" onclick="loadChart('RELIANCE')">RELIANCE</div>
        <div class="stock-btn" onclick="loadChart('SBIN')">SBIN</div>
        </div>
</div>

<script>
    // Ye function chart load karega aur "NSE:" apne aap laga dega
    function loadChart(symbol) {
        document.getElementById('current_symbol').innerText = "NSE:" + symbol;
        
        new TradingView.widget({
            "container_id": "tv_chart_main",
            "symbol": "NSE:" + symbol, // Yahan humne NSE add kar diya fix ke liye
            "interval": "5",
            "theme": "dark",
            "style": "1",
            "autosize": true,
            "locale": "in",
            "timezone": "Asia/Kolkata",
            "hide_top_toolbar": false,
            "allow_symbol_change": true,
            "save_image": false
        });
    }

    function showTab(name) {
        console.log("Tab switched to: " + name);
        // Tab switching logic yahan aayegi
    }

    // Default chart on load
    window.onload = function() {
        loadChart("NIFTY");
    };
</script>

</body>
</html>
