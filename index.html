<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SKL VIP TERMINAL PRO V2000</title>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <style>
        :root { --bg: #05070a; --card: #11151c; --gold: #d4af37; --bull: #00ffcc; --bear: #ff4d4d; --dim: #8a949d; }
        body { margin: 0; background: var(--bg); color: white; font-family: 'Inter', sans-serif; padding-bottom: 70px; }
        
        /* HEADER - Image 4 style */
        .top-nav { background: #0d1117; padding: 15px; border-bottom: 1px solid #1e252e; position: sticky; top: 0; z-index: 100; text-align: center; }
        .app-title { color: var(--gold); font-weight: 900; font-size: 18px; letter-spacing: 1px; }

        /* TRIAL TIMER - Image 4 style */
        .trial-card { background: rgba(212, 175, 55, 0.1); border: 1px solid var(--gold); border-radius: 10px; margin: 10px; padding: 12px; text-align: center; font-size: 12px; }

        /* MARKET POWER - Image 3 style */
        .power-meter { background: var(--card); border: 1px solid #232a33; border-radius: 12px; padding: 15px; margin: 12px; }
        .bar-bg { height: 8px; background: #222; border-radius: 4px; margin: 10px 0; overflow: hidden; }
        .bar-fill { height: 100%; background: linear-gradient(90deg, var(--bull), #0088ff); width: 72%; }

        /* SCANNER LIST - Image 1 & 4 style */
        .scanner-card { background: var(--card); margin: 12px; border-radius: 12px; border: 1px solid #232a33; overflow: hidden; }
        .scan-row { display: flex; justify-content: space-between; padding: 15px; border-bottom: 1px solid #1e252e; align-items: center; }
        .symbol { font-weight: bold; font-size: 14px; }
        .signal-tag { padding: 4px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; }
        .tag-buy { background: rgba(0, 255, 204, 0.1); color: var(--bull); border: 1px solid var(--bull); }

        /* BOTTOM NAV - Image 1 style */
        .footer { position: fixed; bottom: 0; width: 100%; background: #0d1117; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #1e252e; z-index: 1000; }
        .f-item { text-align: center; color: var(--dim); font-size: 10px; cursor: pointer; }
        .f-item.active { color: var(--gold); }
    </style>
</head>
<body>

<div class="top-nav">
    <div class="app-title">SKL VIP TERMINAL PRO</div>
</div>

<div class="trial-card">
    <span>⏱️ YOUR VIP TRIAL PERIOD ENDS IN:</span>
    <div id="timer" style="color:var(--gold); font-weight:bold; font-size:16px; margin-top:5px;">02d 23h 59m 44s</div>
</div>

<div id="home-page" class="active-page" style="display: block; padding-bottom: 20px;">
    <div class="power-meter">
        <div style="display:flex; justify-content:space-between; font-size:11px;">
            <span>MARKET POWER</span> <span style="color:var(--bull);">STRONG BULLISH 📈</span>
        </div>
        <div class="bar-bg"><div class="bar-fill"></div></div>
        <div style="display:flex; justify-content:space-between; font-size:10px;">
            <span>BULL 72%</span> <span>BEAR 28%</span>
        </div>
    </div>

    <div style="height: 250px; margin: 12px; border-radius: 12px; overflow: hidden; border: 1px solid #232a33;">
        <div id="tradingview_chart" style="height: 100%;"></div>
    </div>

    <div style="padding: 0 15px; color: var(--gold); font-size: 11px; font-weight: bold; text-transform: uppercase;">VIP Live Signals</div>
    <div class="scanner-card">
        <div class="scan-row">
            <div><div class="symbol">NIFTY 50</div><div style="color:var(--dim); font-size:10px;">Index Hub</div></div>
            <div style="text-align:right;"><div class="price-live">₹22,512.30</div><div class="signal-tag tag-buy">STRONG BUY ▲</div></div>
        </div>
        <div class="scan-row">
            <div><div class="symbol">DIXON</div><div style="color:var(--dim); font-size:10px;">Derivatives</div></div>
            <div style="text-align:right;"><div class="price-live">₹11,245.00</div><div class="signal-tag tag-buy">BTST BULLISH ▲</div></div>
        </div>
    </div>
</div>

<div class="footer">
    <div class="f-item active">🏠<br>HOME</div>
    <div class="f-item">📈<br>CHART</div>
    <div class="f-item">⛓️<br>OPTIONS</div>
    <div class="f-item">👤<br>ACCOUNT</div>
</div>

<script>
    // TradingView Chart
    new TradingView.widget({
        "autosize": true, "symbol": "NSE:NIFTY", "interval": "5", "timezone": "Asia/Kolkata",
        "theme": "dark", "style": "1", "locale": "en", "container_id": "tradingview_chart",
        "hide_top_toolbar": true, "backgroundColor": "#11151c"
    });

    // Trial Timer
    let time = 259184; 
    setInterval(() => {
        time--;
        let d = Math.floor(time / 86400);
        let h = Math.floor((time % 86400) / 3600);
        let m = Math.floor((time % 3600) / 60);
        let s = time % 60;
        document.getElementById('timer').innerText = `${d}d ${h}h ${m}m ${s}s`;
    }, 1000);
</script>
</body>
</html>
