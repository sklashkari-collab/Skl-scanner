<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SKL VIP TERMINAL PRO</title>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #05070a; --card: #11151c; --gold: #d4af37; --bull: #00ffcc; --bear: #ff4d4d; --dim: #8a949d; }
        body { margin: 0; background: var(--bg); color: white; font-family: 'Noto Sans Gujarati', sans-serif; overflow: hidden; height: 100vh; }
        #login-screen { position: fixed; inset: 0; background: var(--bg); z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .login-box { background: var(--card); padding: 30px; border-radius: 15px; border: 1px solid var(--gold); width: 100%; max-width: 300px; text-align: center; }
        input { width: 90%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #232a33; background: #05070a; color: white; outline: none; font-size: 16px; }
        .btn { background: var(--gold); color: black; padding: 12px; width: 100%; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .page { display: none; padding: 15px; padding-bottom: 90px; height: 85vh; overflow-y: auto; }
        .active-page { display: block; }
        .scanner-card { background: var(--card); border-radius: 12px; border: 1px solid #232a33; margin-bottom: 15px; padding: 15px; }
        .scan-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #1e252e; }
        .footer { position: fixed; bottom: 0; width: 100%; background: #0d1117; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #1e252e; }
        .f-item { text-align: center; color: var(--dim); font-size: 10px; cursor: pointer; flex: 1; }
        .f-item.active { color: var(--gold); font-weight: bold; }
        #chart-div { height: 400px; width: 100%; border-radius: 12px; }
        .header-title { text-align: center; color: var(--gold); font-weight: 900; margin-bottom: 10px; }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-box">
        <h2 style="color:var(--gold);">SKL VIP લોગિન</h2>
        <input type="text" id="client-id" placeholder="ID: L121534">
        <input type="password" id="pin" placeholder="Password: 1234">
        <button class="btn" onclick="startApp()">લોગિન કરો</button>
        <p id="msg" style="color:var(--bear); font-size:12px; margin-top:10px;"></p>
    </div>
</div>

<div id="app-ui" style="display:none;">
    <div id="home" class="page active-page">
        <div class="header-title">માર્કેટ ટર્મિનલ [લાઇવ]</div>
        <div class="scanner-card" style="text-align:center;">
            <div id="nifty-live" style="font-size:28px; font-weight:900; color:var(--bull);">₹22,713.10</div>
            <div style="color:var(--gold); font-size:10px;">● API CONNECTED ✅</div>
        </div>
        <div class="scanner-card" id="stock-list"></div>
    </div>
    <div id="chart-page" class="page"><div id="chart-div"></div></div>
    <div id="options-page" class="page"><div class="scanner-card" id="oc-data"></div></div>
    
    <div class="footer">
        <div class="f-item active" onclick="changeTab('home', this)">🏠<br>માર્કેટ</div>
        <div class="f-item" onclick="changeTab('chart-page', this); loadTV();">📈<br>ચાર્ટ</div>
        <div class="f-item" onclick="changeTab('options-page', this)">⛓️<br>ઓપ્શન્સ</div>
    </div>
</div>

<script>
    function startApp() {
        const id = document.getElementById('client-id').value;
        const pass = document.getElementById('pin').value;
        if(id === "L121534" && pass === "1234") {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-ui').style.display = 'block';
            syncData();
        } else {
            document.getElementById('msg').innerText = "ભૂલ: સાચો ID કે પાસવર્ડ નાખો!";
        }
    }

    function changeTab(id, el) {
        document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
        document.getElementById(id).style.display = 'block';
        document.querySelectorAll('.f-item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
    }

    function loadTV() {
        new TradingView.widget({"container_id": "chart-div", "symbol": "NSE:NIFTY", "interval": "5", "theme": "dark", "style": "1"});
    }

    function syncData() {
        const stocks = [
            { n: "DIXON", p: "11,245", s: "BULLISH" },
            { n: "BOSCHLTD", p: "32,510", s: "STRONG BUY" }
        ];
        let h = "";
        stocks.forEach(s => { h += `<div class="scan-row"><span><b>${s.n}</b><br><small>${s.s}</small></span><b style="color:var(--bull)">₹${s.p}</b></div>`; });
        document.getElementById('stock-list').innerHTML = h;

        const oc = [{ s: 22700, c: 85, p: 78 }, { s: 22800, c: 30, p: 140 }];
        let o = "<b>CE &nbsp;&nbsp;&nbsp; STRIKE &nbsp;&nbsp;&nbsp; PE</b><hr>";
        oc.forEach(x => { o += `<div class="scan-row"><span style="color:var(--bull)">${x.c}</span><b>${x.s}</b><span style="color:var(--bear)">${x.p}</span></div>`; });
        document.getElementById('oc-data').innerHTML = o;
    }
    setInterval(syncData, 3000);
</script>
</body>
</html>
