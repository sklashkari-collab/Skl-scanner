<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKL SCANNER V4</title>
    <style>
        body { margin: 0; background: #000; color: #bf953f; font-family: sans-serif; text-align: center; }
        .header { padding: 20px; border-bottom: 2px solid #bf953f; font-size: 22px; font-weight: bold; }
        #stock-box { margin: 15px; padding: 15px; background: #111; border: 1px solid #333; border-radius: 10px; }
        #chart-container { width: 95%; height: 500px; margin: auto; border: 2px solid #bf953f; border-radius: 8px; overflow: hidden; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 20px; }
        button { background: #1e293b; color: white; border: 1px solid #bf953f; padding: 12px; border-radius: 5px; font-weight: bold; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

<div class="header">SKL SCANNER V4 🚀</div>

<div id="stock-box">
    <h2 id="stk-name" style="margin:0; color:white;">NIFTY 50</h2>
    <small style="color: #22c55e;">SIGNAL: SCANNING LIVE...</small>
</div>

<div id="chart-container">
    <iframe id="tv-chart" src="https://s.tradingview.com/widgetembed/?symbol=NSE:NIFTY&interval=5&theme=dark&locale=in"></iframe>
</div>

<div class="btn-grid">
    <button onclick="update('NIFTY')">NIFTY</button>
    <button onclick="update('BANKNIFTY')">BANK NIFTY</button>
    <button onclick="update('RELIANCE')">RELIANCE</button>
    <button onclick="update('SBIN')">SBI BANK</button>
    <button onclick="update('AARTIIND')">AARTI IND</button>
    <button onclick="update('TATAMOTORS')">TATA MOTORS</button>
</div>

<script>
    function update(s) {
        document.getElementById('stk-name').innerText = s;
        document.getElementById('tv-chart').src = "https://s.tradingview.com/widgetembed/?symbol=NSE:" + s + "&interval=5&theme=dark&locale=in";
    }
</script>

</body>
</html>
