<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>SKL TERMINAL PRO - AI PREDICTOR</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://s3.tradingview.com/tv.js"></script>
    <style>
        :root { --gold: linear-gradient(45deg, #bf953f, #fcf6ba, #b38728); --bg: #000; --card: #0f172a; --red: #ff4d4d; --green: #00ff88; }
        body { margin: 0; background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; overflow-x: hidden; }
        .header { background: #0a0a0a; padding: 15px; text-align: center; border-bottom: 2px solid #bf953f; position: sticky; top:0; z-index:1000; }
        
        /* Navigation Tabs */
        .nav-tabs { display: flex; overflow-x: auto; gap: 8px; padding: 10px; background: #111; border-bottom: 1px solid #222; position: sticky; top: 60px; z-index: 999; scrollbar-width: none; }
        .tab { background: #1e293b; padding: 10px 18px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; color: #94a3b8; white-space: nowrap; border: 1px solid #333; }
        .tab.active { background: var(--gold); color: #000; border: none; }
        
        .container { padding: 10px; max-width: 800px; margin: auto; }
        .box { background: var(--card); border-radius: 10px; padding: 15px; border: 1px solid #1e293b; margin-bottom: 15px; }

        /* Signal Badges */
        .sig-badge { font-size: 10px; padding: 3px 8px; border-radius: 4px; font-weight: bold; margin-top: 5px; display: inline-block; }
        .bullish { background: rgba(0, 255, 136, 0.15); color: var(--green); border: 1px solid var(--green); }
        .bearish { background: rgba(255, 77, 77, 0.15); color: var(--red); border: 1px solid var(--red); }

        .market-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .list-item { background: #1e293b; padding: 12px; border-radius: 8px; border-left: 4px solid #bf953f; cursor: pointer; }
        
        /* Analysis Meter */
        .meter-container { height: 180px; width: 100%; margin-top: 10px; border-top: 1px solid #333; }

        .hidden { display: none; }
        .search-box { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #111; color: white; margin-bottom: 10px; box-sizing: border-box; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

<div class="header">
    <h2 style="margin:0; font-size: 20px; color: #fff;">SKL AI TERMINAL PRO 🚀</h2>
</div>

<div class="nav-tabs">
    <div class="tab active" onclick="showTab('dash')">DASHBOARD</div>
    <div class="tab" onclick="showTab('fno')">206 FnO SCANNER</div>
    <div class="tab" onclick="showTab('opt_chain')">OI ANALYSIS</div>
    <div class="tab" onclick="showTab('mcx')">COMMODITY</div>
</div>

<div class="container">
    
    <div id="tab_dash">
        <div class="box" style="text-align: center; border: 1px solid #bf953f;">
            <h4 style="color:#bf953f; margin:0;">🎯 NEXT DAY PREDICTION</h4>
            <div id="hero_stock" style="font-size: 22px; font-weight: bold; margin: 5px 0;">NIFTY 50</div>
            <div id="hero_sig" class="sig-badge bullish">SCANNING MARKET...</div>
        </div>
        
        <div class="box" style="height: 450px; padding: 0; overflow: hidden; border: 1px solid #333;">
            <div id="tv_chart_main" style="height: 100%;"></div>
        </div>

        <div class="box" style="padding:0; height: 220px;">
            <div class="meter-container" id="ai_meter">
                <iframe id="tv_meter" src="https://s.tradingview.com/embed-widget/technical-analysis/?symbol=NSE:NIFTY&interval=1m&theme=dark&locale=in"></iframe>
            </div>
        </div>
    </div>

    <div id="tab_fno" class="hidden">
        <input type="text" id="stockSearch" class="search-box" placeholder="Search F&O Stocks (e.g. RELIANCE)..." onkeyup="filterStocks()">
        <div class="market-grid" id="fno_container"></div>
    </div>

    <div id="tab_opt_chain" class="hidden">
        <div class="box" style="height: 500px; padding:0;">
            <iframe src="https://s.tradingview.com/embed-widget/hotlists/?theme=dark&locale=in"></iframe>
        </div>
    </div>

    <div id="tab_mcx" class="hidden">
        <div class="market-grid" id="mcx_list"></div>
    </div>

</div>

<script>
    let currentSym = "NIFTY";
    const fnoStocks = ["AARTIIND", "ABB", "ABBOTINDIA", "ABCAPITAL", "ABFRL", "ACC", "ADANIENT", "ADANIPORTS", "ALKEM", "AMBUJACEM", "APOLLOHOSP", "APOLLOTYRE", "ASHOKLEY", "ASIANPAINT", "ASTRAL", "ATUL", "AUBANK", "AUROPHARMA", "AXISBANK", "BAJAJ-AUTO", "BAJFINANCE", "BAJAJFINSV", "BALKRISIND", "BALRAMCHIN", "BANDHANBNK", "BANKBARODA", "BATAINDIA", "BEL", "BERGEPAINT", "BHARATFORG", "BHARTIARTL", "BHEL", "BIOCON", "BSOFT", "BPCL", "BRITANNIA", "CANBK", "CANFINHOME", "CHAMBLFERT", "CHOLAFIN", "CIPLA", "COALINDIA", "COFORGE", "COLPAL", "CONCOR", "COROMANDEL", "CROMPTON", "CUB", "CUMMINSIND", "DABUR", "DALBHARAT", "DEEPAKNTR", "DELHIVERY", "DIVISLAB", "DIXON", "DLF", "DRREDDY", "EICHERMOT", "ESCORTS", "EXIDEIND", "FEDERALBNK", "GAIL", "GLENMARK", "GMRINFRA", "GNFC", "GODREJCP", "GODREJPROP", "GRANULES", "GRASIM", "GUJGASLTD", "HAL", "HAVELLS", "HCLTECH", "HDFCBANK", "HDFCLIFE", "HEROMOTOCO", "HINDALCO", "HINDCOPPER", "HINDPETRO", "HINDUNILVR", "ICICIBANK", "ICICIGI", "ICICIPRULI", "IDFC", "IDFCFIRSTB", "IEX", "IGL", "INDHOTEL", "INDIACEM", "INDIAMART", "INDIGO", "INDUSINDBK", "INDUSTOWER", "INFY", "IPCALAB", "IRCTC", "ITC", "JINDALSTEL", "JKCEMENT", "JSWSTEEL", "JUBLFOOD", "KOTAKBANK", "LALPATHLAB", "LAURUSLABS", "LICHSGFIN", "LTIM", "LT", "LUPIN", "M&M", "M&MFIN", "MANAPPURAM", "MARICO", "MARUTI", "MCX", "METROPOLIS", "MFSL", "MGL", "MOTHERSON", "MPHASIS", "MRF", "MUTHOOTFIN", "NATIONALUM", "NAVINFLUOR", "NESTLEIND", "NMDC", "NTPC", "OBEROIRLTY", "OFSS", "ONGC", "PAGEIND", "PEL", "PERSISTENT", "PETRONET", "PFC", "PIDILITIND", "PIIND", "PNB", "POLYCAB", "POWERGRID", "PVRINOX", "RAMCOCEM", "RBLBANK", "RECELECT", "RELIANCE", "SAIL", "SBICARD", "SBILIFE", "SBIN", "SHREECEM", "SHRIRAMFIN", "SIEMENS", "SRF", "SUNPHARMA", "SUNTV", "SYNGENE", "TATACHEM", "TATACOMM", "TATACONSUM", "TATAMOTORS", "TATAPOWER", "TATASTEEL", "TCS", "TECHM", "TITAN", "TORNTPHARM", "TRENT", "TVSMOTOR", "UBL", "ULTRACEMCO", "UPL", "VEDL", "VOLTAS", "WIPRO", "ZEEL", "ZYDUSLIFE"];
    const commodities = ["GOLD", "SILVER", "CRUDEOIL", "NATURALGAS"];

    function renderList(data, containerId, prefix) {
        const container = document.getElementById(containerId);
        container.innerHTML = "";
        data.forEach(s => {
            const isBullish = Math.random() > 0.4; // AI Logic Simulation
            const div = document.createElement('div');
            div.className = "list-item";
            div.onclick = () => { selectStock(s, prefix); };
            div.innerHTML = `<b>${s}</b><br><span class="sig-badge ${isBullish ? 'bullish' : 'bearish'}">${isBullish ? 'BULLISH 🚀' : 'BEARISH 📉'}</span>`;
            container.appendChild(div);
        });
    }

    function selectStock(name, prefix) {
        currentSym = name;
        showTab('dash');
        document.getElementById('hero_stock').innerText = name;
        
        // Load Main Chart
        new TradingView.widget({
            "container_id": "tv_chart_main",
            "symbol": prefix + name,
            "interval": "5",
            "theme": "dark",
            "style": "1",
            "autosize": true,
            "locale": "in",
            "timezone": "Asia/Kolkata",
            "hide_side_toolbar": false,
            "allow_symbol_change": true,
            "details": true,
            "hotlist": true,
            "calendar": true
        });

        // Update AI Meter
        document.getElementById('tv_meter').src = "https://s.tradingview.com/embed-widget/technical-analysis/?symbol=" + prefix + name + "&interval=1m&theme=dark&locale=in";
    }

    function showTab(name) {
        document.querySelectorAll('.container > div').forEach(d => d.classList.add('hidden'));
        document.getElementById('tab_' + name).classList.remove('hidden');
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        // Find the tab element and mark active
        const tabs = document.querySelectorAll('.tab');
        tabs.forEach(t => { if(t.innerText.includes(name.toUpperCase())) t.classList.add('active'); });
    }

    function filterStocks() {
        let val = document.getElementById('stockSearch').value.toUpperCase();
        let items = document.querySelectorAll('#fno_container .list-item');
        items.forEach(it => { it.style.display = it.innerText.includes(val) ? "" : "none"; });
    }

    window.onload = () => {
        renderList(fnoStocks, 'fno_container', 'NSE:');
        renderList(commodities, 'mcx_list', 'MCX:');
        selectStock("NIFTY", "NSE:");
    };
</script>
</body>
</html>
