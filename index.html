<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SKL MASTER TERMINAL</title>
    <script src="https://s3.tradingview.com/tv.js"></script>
    <style>
        :root { --primary: #0052fe; --bg: #060606; --card: #121212; --green: #00ff88; --red: #ff4d4d; --gold: #bf953f; }
        body { margin: 0; background: var(--bg); color: white; font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        /* Header like Globe Capital */
        .top-nav { background: #000; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; }
        .logo { font-weight: bold; color: var(--gold); font-size: 18px; }
        .market-status { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: rgba(0,255,136,0.1); color: var(--green); }

        /* Main App Body */
        .app-body { display: flex; flex: 1; overflow: hidden; }
        
        /* Sidebar Watchlist (Angel One Style) */
        .watchlist { width: 30%; background: var(--card); border-right: 1px solid #222; display: flex; flex-direction: column; }
        .search-area { padding: 10px; border-bottom: 1px solid #222; }
        .search-input { width: 100%; padding: 8px; background: #000; border: 1px solid #333; color: white; border-radius: 4px; outline: none; font-size: 12px; }
        .list-items { flex: 1; overflow-y: auto; }
        .stock-item { padding: 12px; border-bottom: 1px solid #1a1a1a; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .stock-item:active { background: #1a1a1a; }
        .ticker { font-weight: bold; font-size: 13px; }
        .price-label { text-align: right; font-size: 12px; }

        /* Chart & Signal Area (Upstox Style) */
        .main-panel { flex: 1; display: flex; flex-direction: column; background: #000; }
        .chart-container { flex: 1; position: relative; }
        .signal-panel { height: 180px; background: var(--card); border-top: 1px solid #333; display: flex; flex-direction: column; }
        
        /* Tabs for Data */
        .tab-menu { display: flex; background: #000; border-bottom: 1px solid #222; }
        .tab-btn { flex: 1; padding: 10px; font-size: 11px; text-align: center; color: #777; cursor: pointer; font-weight: bold; }
        .tab-btn.active { color: var(--primary); border-bottom: 2px solid var(--primary); }

        .action-bar { padding: 10px; display: flex; gap: 10px; background: #000; }
        .btn { flex: 1; padding: 12px; border-radius: 6px; border: none; font-weight: bold; color: white; cursor: pointer; }
        .btn-buy { background: var(--green); color: #000; }
        .btn-sell { background: var(--red); }

        @media (max-width: 600px) { .watchlist { width: 40%; } }
    </style>
</head>
<body>

<div class="top-nav">
    <div class="logo">SKL TERMINAL PRO</div>
    <div class="market-status">● LIVE DATA ACTIVE</div>
</div>

<div class="app-body">
    <div class="watchlist">
        <div class="search-area">
            <input type="text" class="search-input" placeholder="Search FnO / MCX..." onkeyup="searchStock(this.value)">
        </div>
        <div class="list-items" id="stock-list">
            </div>
    </div>

    <div class="main-panel">
        <div class="chart-container" id="tv_chart_main"></div>
        
        <div class="signal-panel">
            <div class="tab-menu">
                <div class="tab-btn active" onclick="loadTools('meter')">AI SIGNAL</div>
                <div class="tab-btn" onclick="loadTools('oi')">OI DATA</div>
                <div class="tab-btn" onclick="loadTools('info')">INFO</div>
            </div>
            <div id="tool-view" style="flex:1;">
                <iframe id="signal-frame" style="width:100%; height:100%; border:none;"></iframe>
            </div>
            <div class="action-bar">
                <button class="btn btn-buy">BUY CALL</button>
                <button class="btn btn-sell">BUY PUT</button>
            </div>
        </div>
    </div>
</div>

<script>
    const stocks = [
        { name: "NIFTY", sym: "NSE:NIFTY", type: "Index" },
        { name: "BANKNIFTY", sym: "NSE:BANKNIFTY", type: "Index" },
        { name: "RELIANCE", sym: "NSE:RELIANCE", type: "Stock" },
        { name: "SBIN", sym: "NSE:SBIN", type: "Stock" },
        { name: "CRUDEOIL", sym: "MCX:CRUDEOIL1!", type: "Commodity" },
        { name: "SILVER", sym: "MCX:SILVER1!", type: "Commodity" },
        { name: "GOLD", sym: "MCX:GOLD1!", type: "Commodity" },
        { name: "AARTIIND", sym: "NSE:AARTIIND", type: "F&O" }
    ];

    let currentSym = "NSE:NIFTY";

    function renderWatchlist() {
        const container = document.getElementById('stock-list');
        container.innerHTML = "";
        stocks.forEach(s => {
            container.innerHTML += `
                <div class="stock-item" onclick="updateTerminal('${s.sym}')">
                    <div class="ticker">${s.name}<br><small style="color:#555">${s.type}</small></div>
                    <div class="price-label"><span class="${Math.random() > 0.5 ? 'up' : 'down'}">LIVE</span></div>
                </div>`;
        });
    }

    function updateTerminal(symbol) {
        currentSym = symbol;
        
        // 1. Load Professional Chart (TradingView Method)
        new TradingView.widget({
            "autosize": true,
            "symbol": symbol,
            "interval": "5",
            "timezone": "Asia/Kolkata",
            "theme": "dark",
            "style": "1",
            "locale": "in",
            "toolbar_bg": "#f1f3f6",
            "enable_publishing": false,
            "hide_side_toolbar": false,
            "allow_symbol_change": true,
            "container_id": "tv_chart_main"
        });

        loadTools('meter');
    }

    function loadTools(type) {
        const frame = document.getElementById('signal-frame');
        if(type === 'meter') {
            frame.src = `https://s.tradingview.com/embed-widget/technical-analysis/?symbol=${currentSym}&interval=1m&theme=dark&locale=in`;
        } else if(type === 'oi') {
            frame.src = `https://s.tradingview.com/embed-widget/hotlists/?theme=dark&locale=in`;
        } else if(type === 'info') {
            frame.src = `https://s.tradingview.com/embed-widget/symbol-info/?symbol=${currentSym}&theme=dark&locale=in`;
        }
    }

    function searchStock(val) {
        const items = document.querySelectorAll('.stock-item');
        items.forEach(it => {
            it.style.display = it.innerText.toUpperCase().includes(val.toUpperCase()) ? "flex" : "none";
        });
    }

    window.onload = () => {
        renderWatchlist();
        updateTerminal("NSE:NIFTY");
    };
</script>
</body>
</html>
