<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VIP SKL TERMINAL - LOGIN</title>
    <style>
        :root { --gold: #bf953f; --bg: #000; --card: #121212; --primary: #0052fe; }
        body { margin: 0; background: var(--bg); color: white; font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        .login-card { width: 90%; max-width: 400px; background: var(--card); padding: 30px; border-radius: 20px; border: 1px solid #333; text-align: center; }
        .logo { font-size: 28px; font-weight: bold; color: var(--gold); margin-bottom: 10px; }
        .tagline { font-size: 14px; color: #888; margin-bottom: 30px; }
        input { width: 100%; padding: 15px; margin-bottom: 20px; background: #000; border: 1px solid #444; color: white; border-radius: 10px; font-size: 16px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: var(--gold); border: none; border-radius: 10px; color: black; font-weight: bold; font-size: 16px; cursor: pointer; }
        .otp-screen { display: none; }
        .timer { font-size: 12px; color: var(--gold); margin-top: 10px; }
    </style>
</head>
<body>

<div class="login-card" id="login-step">
    <div class="logo">SKL VIP TERMINAL</div>
    <div class="tagline">Premium Access for Professional Traders</div>
    <input type="tel" id="mobile" placeholder="Enter Mobile Number" maxlength="10">
    <button onclick="sendOTP()">GET OTP</button>
</div>

<div class="login-card otp-screen" id="otp-step">
    <div class="logo">VERIFY OTP</div>
    <div class="tagline">OTP sent to your mobile number</div>
    <input type="number" id="otp-input" placeholder="Enter 6-Digit OTP">
    <button onclick="verifyLogin()">VERIFY & LOGIN</button>
    <div class="timer">Resend OTP in 59s</div>
</div>

<script>
    function sendOTP() {
        let mobile = document.getElementById('mobile').value;
        if(mobile.length === 10) {
            document.getElementById('login-step').style.display = 'none';
            document.getElementById('otp-step').style.display = 'block';
            alert("OTP Sent Successfully (Demo Mode)");
        } else {
            alert("Please enter a valid 10-digit mobile number");
        }
    }

    function verifyLogin() {
        // Step 2 logic will trigger trial period start
        localStorage.setItem('vip_user_logged', 'true');
        localStorage.setItem('trial_start_date', new Date().getTime());
        window.location.href = "dashboard.html"; // Next step will create this page
    }
</script>
</body>
</html>
