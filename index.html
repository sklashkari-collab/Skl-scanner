<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SKL VIP TERMINAL PRO</title>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <style>
        :root { --bg: #05070a; --card: #11151c; --gold: #d4af37; --bull: #00ffcc; --bear: #ff4d4d; --dim: #8a949d; }
        body { margin: 0; background: var(--bg); color: white; font-family: 'Inter', sans-serif; padding-bottom: 80px; overflow-x: hidden; }
        .page { display: none; padding: 10px; animation: fadeIn 0.3s; }
        .active-page { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .scanner-card { background: var(--card); border-radius: 12px; border: 1px solid #232a33; margin-bottom: 15px; overflow: hidden; padding: 15px; }
        .scan-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #1e252e; }
        .footer { position: fixed; bottom: 0; width: 100%; background: #0d1117; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #1e252e; z-index: 1000; }
        .f-item { text-align: center; color: var(--dim); font-size: 10px; cursor: pointer; flex: 1; }
        .f-item.active { color: var(--gold); font-weight: bold; }
        #chart-container { height: 350px; width: 100%; border-radius: 12px; overflow: hidden; margin-top: 10px; }
    </style>
</head>
<body>

<div id="home" class="page active-page">
    <div style="text-align: center; padding: 10px; color: var(--gold); font-weight: 900;">SKL VIP TERMINAL [LIVE]</div>
    
    <div class="scanner-card" style="text-align: center;">
        <div style="font-size: 11px; color: var(--dim);">NIFTY 50 INDEX</div>
        <div id="live-nifty" style="font-size: 32px; font-weight: 900; color: var(--bull);">Loading...</div>
        <div id="market-status" style="font-size: 10px; color: var(--gold);">REAL DATA CONNECTING...</div>
    </div>

    <div style="padding: 5px 10px; font-size: 11px; color: var(--gold);">🚀 LIVE VIP SIGNALS</div>
    <div class="scanner-card" id="stock-list">
        </div>
</div>

<div id="chart-page" class="page">
    <div class="scanner-card">
        <div id="chart-container"></div>
    </div>
</div>

<div id="options" class="page">
    <div class="scanner-card">
        <h3 style="color:var(--gold);">⛓️ OPTION CHAIN (22700 ATM)</h3>
        <div class="scan-row" style="color:var(--dim); font-size:11px;"><span>CALL (CE)</span><span>STRIKE</span><span>PUT (PE)</span></div>
        <div class="scan-row"><span style="color:var(--bull);">145.20</span><b>22700</b><span style="color:var(--bear);">112.40</span></div>
    </div>
</div>

<div id="account" class="page">
    <div class="scanner-card">
        <h3>Profile Details</h3>
        <p>Client ID: <span style="color:var(--gold); font-weight:bold;">L121534</span></p>
        <p>Status: <span style="color:var(--bull);">API CONNECTED ✅</span></p>
    </div>
</div>

<div class="footer">
    <div class="f-item active" onclick="showPage('home', this)">🏠<br>HOME</div>
    <div class="f-item" onclick="showPage('chart-page', this); loadChart();">📈<br>CHART</div>
    <div class="f-item" onclick="showPage('options', this)">⛓️<br>OPTIONS</div>
    <div class="f-item" onclick="showPage('account', this)">👤<br>ACCOUNT</div>
</div>

<script>
    function showPage(pageId, element) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
        document.getElementById(pageId).classList.add('active-page');
        document.querySelectorAll('.f-item').forEach(i => i.classList.remove('active'));
        element.classList.add('active');
    }

    // TradingView Chart Fix
    function loadChart() {
        new TradingView.widget({
            "container_id": "chart-container",
            "symbol": "NSE:NIFTY",
            "interval": "5",
            "timezone": "Asia/Kolkata",
            "theme": "dark",
            "style": "1",
            "locale": "en",
            "hide_side_toolbar": false,
            "allow_symbol_change": true,
            "save_image": false
        });
    }

    // Real Data Connection
    async function updateData() {
        try {
            const res = await fetch('/.netlify/functions/market');
            const data = await res.json();
            document.getElementById('live-nifty').innerText = "₹" + data.nifty;
            document.getElementById('market-status').innerText = "● " + data.status;
            
            const list = document.getElementById('stock-list');
            list.innerHTML = `
                <div class="scan-row">
                    <div><b>${data.topGainer}</b><br><small style="color:var(--dim)">Top Gainer</small></div>
                    <div style="text-align:right;"><b style="color:var(--bull)">₹${data.gainerPrice}</b></div>
                </div>
            `;
        } catch (e) { console.log("Waiting for market.js..."); }
    }

    setInterval(updateData, 2000);
    window.onload = updateData;
</script>
</body>
</html>
