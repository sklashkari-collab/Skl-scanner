<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKL SCANNER V5 PRO</title>
    <style>
        body { margin: 0; background: #000; color: #bf953f; font-family: sans-serif; text-align: center; }
        .header { padding: 15px; border-bottom: 2px solid #bf953f; font-size: 18px; font-weight: bold; background: #0a0a0a; }
        #chart-container { width: 100%; height: 450px; background: #111; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; padding: 12px; background: #050505; }
        button { background: #1e293b; color: white; border: 1px solid #bf953f; padding: 12px 5px; border-radius: 6px; font-size: 11px; font-weight: bold; }
        button:active { background: #bf953f; color: #000; }
        .analysis-box { width: 100%; height: 220px; border-top: 1px solid #333; margin-top: 5px; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

<div class="header">SKL SCANNER V5 PRO 🚀</div>

<div id="chart-container">
    <iframe id="tv-chart" src="https://s.tradingview.com/widgetembed/?symbol=NIFTY&interval=5&theme=dark&style=1&locale=in"></iframe>
</div>

<div class="analysis-box">
    <iframe id="tv-analysis" src="https://s.tradingview.com/embed-widget/technical-analysis/?symbol=NSE:NIFTY&interval=1m&theme=dark&locale=in"></iframe>
</div>

<div class="btn-grid">
    <button onclick="update('NIFTY')">NIFTY 50</button>
    <button onclick="update('BANKNIFTY')">BANK NIFTY</button>
    <button onclick="update('RELIANCE')">RELIANCE</button>
    <button onclick="update('SBIN')">SBI BANK</button>
    <button onclick="update('TATAMOTORS')">TATA MOTORS</button>
    <button onclick="update('AARTIIND')">AARTI IND</button>
</div>

<script>
    function update(s) {
        // Fix: TradingView widget ke liye direct symbol use kar rahe hain
        document.getElementById('tv-chart').src = "https://s.tradingview.com/widgetembed/?symbol=" + s + "&interval=5&theme=dark&locale=in";
        document.getElementById('tv-analysis').src = "https://s.tradingview.com/embed-widget/technical-analysis/?symbol=NSE:" + s + "&interval=1m&theme=dark&locale=in";
    }
</script>

</body>
</html>
