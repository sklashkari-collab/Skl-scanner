<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKL SCANNER PRO</title>
    <style>
        body { margin: 0; background: #000; color: #bf953f; font-family: sans-serif; text-align: center; }
        .header { padding: 15px; border-bottom: 2px solid #bf953f; font-size: 18px; font-weight: bold; background: #0a0a0a; }
        #tv_chart_container { width: 100%; height: 500px; background: #111; border-bottom: 1px solid #333; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; padding: 15px; background: #050505; }
        button { background: #1e293b; color: white; border: 1px solid #bf953f; padding: 12px 5px; border-radius: 6px; font-size: 11px; font-weight: bold; }
    </style>
</head>
<body>

<div class="header">SKL SCANNER V4 PRO 🚀</div>

<div id="tv_chart_container"></div>

<div class="btn-grid">
    <button onclick="changeSymbol('NSE:NIFTY')">NIFTY</button>
    <button onclick="changeSymbol('NSE:BANKNIFTY')">BANK NIFTY</button>
    <button onclick="changeSymbol('NSE:RELIANCE')">RELIANCE</button>
    <button onclick="changeSymbol('NSE:SBIN')">SBIN</button>
    <button onclick="changeSymbol('NSE:TATAMOTORS')">TATA MOTORS</button>
    <button onclick="changeSymbol('NSE:AARTIIND')">AARTI IND</button>
</div>

<script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
<script type="text/javascript">
    function loadChart(symbol) {
        new TradingView.widget({
            "autosize": true,
            "symbol": symbol,
            "interval": "5",
            "timezone": "Asia/Kolkata",
            "theme": "dark",
            "style": "1",
            "locale": "in",
            "toolbar_bg": "#f1f3f6",
            "enable_publishing": false,
            "hide_top_toolbar": false,
            "allow_symbol_change": true,
            "container_id": "tv_chart_container"
        });
    }

    function changeSymbol(s) {
        loadChart(s);
    }

    // Default load
    window.onload = function() {
        loadChart("NSE:NIFTY");
    }
</script>

</body>
</html>
